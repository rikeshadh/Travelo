services:
  mongo:
    image: mongo:7
    container_name: travelo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: travelo-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/travelo
      PORT: 5000
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      args:
        # Browser calls the backend on the host during local Docker testing.
        VITE_API_URL: http://localhost:5000
    container_name: travelo-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo-data:
